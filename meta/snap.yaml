apps:
  web:
    user: openvpn
    command: bin/service.web.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s
    before: [server]
  server:
    command: bin/service.server.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s
  nginx:
    user: openvpn
    command: bin/service.nginx.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

confinement: strict
description: Secure connection to your Syncloud device over the Internet
grade: stable
name: openvpn
summary: OpenVPN
